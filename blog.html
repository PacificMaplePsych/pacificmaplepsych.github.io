  <style>
    /* ===== Blog hub (all classes prefixed "bh-" so nothing else on the site is affected) ===== */
    .bh-wrap {
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
    }

    /* Intro line + divider, above the featured article */
    .bh-lede {
      text-align: center;
      margin: 0 auto clamp(36px, 5vw, 56px);
    }

    .bh-intro {
      max-width: 780px;
      margin: 0 auto;
      font-family: var(--pm-serif, Georgia, serif);
      font-style: italic;
      font-size: 17px;
      line-height: 1.5;
      color: var(--pm-plum, #453346);
    }

    /* Short centred rule with a small mauve diamond in the middle */
    .bh-divider {
      position: relative;
      display: block;
      width: 160px;
      height: 1px;
      margin: 26px auto 0;
      background: linear-gradient(to right,
        transparent, var(--pm-line, #e3dce2) 15%,
        var(--pm-mauve, #7a5d7c) 50%,
        var(--pm-line, #e3dce2) 85%, transparent);
    }

    .bh-divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      background: var(--pm-mauve, #7a5d7c);
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .bh-section {
      background: #fff;
      padding: clamp(18px, 2.5vw, 30px) 0 clamp(56px, 8vw, 96px);
    }

    /* Category pill */
    .bh-pill {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--pm-heather, #f6f0f4);
      color: var(--pm-mauve, #7a5d7c);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .bh-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .bh-date {
      font-size: 14px;
      color: var(--pm-muted, #5d5361);
    }

    /* ----- Featured (newest) post ----- */
    .bh-featured {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: clamp(24px, 5vw, 64px);
      align-items: center;
      text-decoration: none;
      color: inherit;
      padding-bottom: clamp(36px, 5vw, 56px);
      border-bottom: 1px solid var(--pm-line, #e3dce2);
    }

    .bh-featured-img {
      aspect-ratio: 3 / 2;
      border-radius: var(--pm-radius, 14px);
      overflow: hidden;
      background: var(--pm-heather, #f6f0f4);
    }

    .bh-featured-img img,
    .bh-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s var(--pm-ease, ease);
    }

    .bh-featured:hover .bh-featured-img img,
    .bh-card:hover .bh-card-img img {
      transform: scale(1.03);
    }

    .bh-eyebrow {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--pm-harbour, #3d6780);
      margin-bottom: 12px;
    }

    .bh-featured h2 {
      font-family: var(--pm-serif, Georgia, serif);
      font-weight: 500;
      font-size: clamp(28px, 3.4vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--pm-plum, #453346);
      margin: 0 0 16px;
    }

    .bh-featured:hover h2 {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }

    .bh-featured p {
      font-size: 17px;
      line-height: 1.65;
      color: var(--pm-muted, #5d5361);
      margin: 0 0 18px;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ----- Topic tabs ----- */
    .bh-tabs {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin: clamp(32px, 5vw, 52px) 0 clamp(28px, 4vw, 40px);
      border-top: 1px solid var(--pm-line, #e3dce2);
      border-bottom: 1px solid var(--pm-line, #e3dce2);
    }

    .bh-tab {
      appearance: none;
      background: none;
      border: 0;
      border-right: 1px solid var(--pm-line, #e3dce2);
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      padding: 16px 18px 13px;
      font: inherit;
      font-size: 15px;
      color: var(--pm-muted, #5d5361);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .bh-tabs::-webkit-scrollbar { display: none; }
    .bh-tab:last-child { border-right: 0; }

    .bh-tab:hover {
      background: var(--pm-heather, #f6f0f4);
      color: var(--pm-plum, #453346);
    }

    .bh-tab[aria-selected="true"] {
      background: var(--pm-heather, #f6f0f4);
      color: var(--pm-plum, #453346);
      font-weight: 700;
      border-bottom-color: var(--pm-mauve, #7a5d7c);
    }

    .bh-tab:focus-visible {
      outline: 2px solid var(--pm-mauve, #7a5d7c);
      outline-offset: -2px;
    }

    .bh-tab .bh-count {
      font-weight: 400;
      font-size: 13px;
      opacity: 0.7;
      margin-left: 4px;
    }

    /* ----- Card grid ----- */
    .bh-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(28px, 3.5vw, 44px) clamp(20px, 2.6vw, 34px);
    }

    .bh-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .bh-card-img {
      aspect-ratio: 3 / 2;
      border-radius: 12px;
      overflow: hidden;
      background: var(--pm-heather, #f6f0f4);
      margin-bottom: 18px;
    }

    .bh-card .bh-pills { margin-bottom: 10px; }

    .bh-card h3 {
      font-family: var(--pm-serif, Georgia, serif);
      font-weight: 500;
      font-size: 21px;
      line-height: 1.28;
      color: var(--pm-plum, #453346);
      margin: 0 0 10px;
    }

    .bh-card:hover h3 {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .bh-card p {
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--pm-muted, #5d5361);
      margin: 0 0 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .bh-card .bh-date { margin-top: auto; }

    .bh-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--pm-muted, #5d5361);
      padding: 40px 0;
    }

    /* ----- Show more ----- */
    .bh-more-wrap {
      text-align: center;
      margin-top: clamp(36px, 5vw, 56px);
    }

    .bh-more {
      appearance: none;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 30px;
      border-radius: 8px;
      border: 1px solid var(--pm-mauve, #7a5d7c);
      background: #fff;
      color: var(--pm-mauve, #7a5d7c);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .bh-more:hover {
      background: var(--pm-mauve, #7a5d7c);
      color: #fff;
    }

    @media (max-width: 960px) {
      .bh-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 760px) {
      .bh-featured { grid-template-columns: 1fr; }

      /* Tabs stay one swipeable row on phones */
      .bh-tab { padding: 14px 16px 11px; font-size: 14.5px; }
    }

    @media (max-width: 560px) {
      .bh-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bh-featured-img img,
      .bh-card-img img { transition: none; }
    }
  </style>
</head>

<body>

  <div id="site-header"></div>

  <main class="entry-content blog-page">

    <!-- TOP TITLE BAND -->
    <section class="page-title-band" aria-label="Blog title">
      <div class="container-narrow">

  </main>

<script>
/* =====================================================================
   BLOG TOPICS
   The order here is the order the tabs appear in (after "All").
   To add a topic later: add one line here, then use its key in posts.json.
   A tab only appears once at least one post uses it.
   ===================================================================== */
const TOPICS = {
  "relationships":   "Relationships",
  "trauma":          "Trauma & Abuse",
  "neurodivergence": "ADHD & Autism",
  "wellbeing":       "Emotional Wellbeing",
  "therapy":         "Therapy & Assessment",
  "pop-culture":     "Pop Culture",
  "general":         "General"
};

const CARDS_PER_LOAD = 12;

/* ===================================================================== */

let allPosts = [];
let currentTopic = "all";
let shown = CARDS_PER_LOAD;

function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* Reads "2026-10-03" as a calendar date (avoids showing the day before in Pacific time) */
function formatDate(iso) {
  const parts = String(iso || "").split("-").map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return esc(iso);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  return d.toLocaleDateString("en-CA", { year: "numeric", month: "long", day: "numeric" });
}

/* Posts with no categories (or only unknown ones) fall under General */
function topicsOf(post) {
  const list = Array.isArray(post.categories) ? post.categories : [];
  const known = list.filter(c => TOPICS[c]);
  return known.length ? known : ["general"];
}

function pills(post, max) {
  return '<div class="bh-pills">' +
    topicsOf(post).slice(0, max).map(c => `<span class="bh-pill">${esc(TOPICS[c])}</span>`).join("") +
    '</div>';
}

function renderFeatured(post) {
  document.getElementById("bh-featured").innerHTML = `
    <a class="bh-featured" href="${esc(post.url)}">
      <div class="bh-featured-img">
        <img src="${esc(post.image)}" alt="${esc(post.title)}" />
      </div>
      <div>
        <span class="bh-eyebrow">Latest article</span>
        ${pills(post, 3)}
        <h2>${esc(post.title)}</h2>
        <p>${esc(post.description)}</p>
        <span class="bh-date">${formatDate(post.date)}</span>
      </div>
    </a>`;
}

function postsForTopic(topic) {
  /* "All" skips the featured post so it isn't shown twice; topic tabs include everything in that topic */
  if (topic === "all") return allPosts.slice(1);
  return allPosts.filter(p => topicsOf(p).includes(topic));
}

function renderTabs() {
  const used = Object.keys(TOPICS).filter(key => postsForTopic(key).length > 0);
  const tabs = [["all", "All", allPosts.length]].concat(
    used.map(key => [key, TOPICS[key], postsForTopic(key).length])
  );

  document.getElementById("bh-tabs").innerHTML = tabs.map(([key, label, count]) => `
    <button type="button" class="bh-tab" role="tab" data-topic="${key}"
      aria-selected="${key === currentTopic}">${esc(label)}<span class="bh-count">${count}</span></button>
  `).join("");

  document.querySelectorAll(".bh-tab").forEach(btn => {
    btn.addEventListener("click", () => selectTopic(btn.dataset.topic));
  });
}

function renderGrid() {
  const list = postsForTopic(currentTopic);
  const grid = document.getElementById("bh-grid");

  grid.innerHTML = list.length
    ? list.slice(0, shown).map(post => `
      <a class="bh-card" href="${esc(post.url)}">
        <div class="bh-card-img">
          <img src="${esc(post.image)}" alt="${esc(post.title)}" loading="lazy" />
        </div>
        ${pills(post, 2)}
        <h3>${esc(post.title)}</h3>
        <p>${esc(post.description)}</p>
        <span class="bh-date">${formatDate(post.date)}</span>
      </a>`).join("")
    : '<p class="bh-empty">New articles on this topic are on the way.</p>';

  document.getElementById("bh-more").hidden = list.length <= shown;
}

function selectTopic(topic, updateUrl = true) {
  currentTopic = (topic === "all" || TOPICS[topic]) ? topic : "all";
  shown = CARDS_PER_LOAD;

  document.querySelectorAll(".bh-tab").forEach(btn => {
    btn.setAttribute("aria-selected", btn.dataset.topic === currentTopic);
  });
  renderGrid();

  /* Gives each topic a shareable link, e.g. /blog.html?topic=pop-culture */
  if (updateUrl) {
    const url = currentTopic === "all" ? "/blog.html" : `/blog.html?topic=${currentTopic}`;
    history.replaceState(null, "", url);
  }
}

document.getElementById("bh-more").addEventListener("click", () => {
  shown += CARDS_PER_LOAD;
  renderGrid();
});

fetch("/blog/posts.json")
  .then(res => res.json())
  .then(posts => {
    allPosts = posts;
    if (!allPosts.length) return;

    renderFeatured(allPosts[0]);

    const requested = new URLSearchParams(window.location.search).get("topic");
    currentTopic = (requested && TOPICS[requested]) ? requested : "all";

    renderTabs();
    selectTopic(currentTopic, false);
  });
</script>

  <script src="/assets/main.js" defer></script>
