  <!-- Page-specific tweaks to restore 2-column layout + floating styled image -->
  <style>
    .blog-page .blog-wrap {
      padding: clamp(34px, 5vw, 64px) 0;
      background: #fff;
    }

    .blog-page .blog-grid {
      display: grid;
      grid-template-columns: 1fr 200px; /* narrower right column pulls image left */
      gap: clamp(18px, 3.2vw, 44px);
      align-items: center;
    }

    .blog-page .blog-text {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 220px;
    }

    /* Right column: align image toward the center by pinning it to left edge of the right column */
    .blog-page .blog-logo {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .blog-page .blog-logo img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      display: block;

      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
      border: 1px solid rgba(0, 0, 0, 0.10);
      background: #fff;
    }

    /* Spacing between blog post cards */
    .blog-card {
      margin-bottom: 3rem;
      text-align: center;
    }

    /* Override 2-column grid so posts use full width */
    .blog-page .blog-grid {
      display: block;
    }

    /* Center the posts with a comfortable reading width */
    #blog-posts {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Remove underline from all text inside card links */
    .blog-card a {
      text-decoration: none;
    }

    /* Re-apply underline on h2 only when hovering, for usability */
    .blog-card a:hover h2 {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .blog-page .blog-grid {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .blog-page .blog-text { min-height: auto; }
      .blog-page .blog-logo { justify-content: center; }
    }

    /* Numbered pagination */
    .blog-pagination {
      max-width: 600px;
      margin: 2.5rem auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .blog-pagination a,
    .blog-pagination span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-decoration: none;
      color: #333;
    }

    .blog-pagination a {
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: #fff;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .blog-pagination a:hover {
      background: #f5f0f6;
      border-color: #7a5d7c;
    }

    .blog-pagination span.current {
      background: #7a5d7c;
      color: #fff;
      font-weight: 600;
    }

    .blog-pagination span.ellipsis {
      border: none;
      color: #999;
    }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PQ2LJL5F"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div id="site-header"></div>

  <main class="entry-content blog-page">

    <!-- TOP TITLE BAND -->
    <section class="page-title-band" aria-label="Blog title">
      <div class="container-narrow">
        <h1>Blog</h1>
      </div>
    </section>

    <!-- CONTENT -->
    <section class="blog-wrap" aria-label="Pacific Maple Psych Centre blog">
      <div class="container-narrow">
        <div class="blog-grid">

          <div id="blog-posts"></div>
          <nav class="blog-pagination" aria-label="Blog pagination"></nav>

<script>

const POSTS_PER_PAGE = 10;

function getCurrentPage() {
  const params = new URLSearchParams(window.location.search);
  const page = parseInt(params.get('page'), 10);
  return page && page > 0 ? page : 1;
}

fetch('/blog/posts.json')

.then(response => response.json())

.then(posts => {

  const totalPages = Math.max(1, Math.ceil(posts.length / POSTS_PER_PAGE));
  const currentPage = Math.min(getCurrentPage(), totalPages);

  const start = (currentPage - 1) * POSTS_PER_PAGE;
  const pagePosts = posts.slice(start, start + POSTS_PER_PAGE);

  const container = document.getElementById('blog-posts');

  container.innerHTML = pagePosts.map(post => `

<article class="blog-card">

<a href="${post.url}">

<img
src="${post.image}"
alt="${post.title}"
style="
width:100%;
max-width:300px;
border-radius:12px;
">

<h2>${post.title}</h2>

<p>${post.description}</p>

<small>${post.date}</small>

</a>

</article>

`).join('');

  // Build numbered pagination, only shown when there's more than 1 page
  const nav = document.querySelector('.blog-pagination');

  if (totalPages <= 1) {
    nav.innerHTML = '';
    return;
  }

  function pageLink(pageNum) {
    return `<a href="/blog.html?page=${pageNum}">${pageNum}</a>`;
  }

  let navHtml = '';

  // Previous arrow
  if (currentPage > 1) {
    navHtml += `<a href="/blog.html?page=${currentPage - 1}" aria-label="Previous page">&laquo;</a>`;
  }

  // Always show page 1
  navHtml += currentPage === 1
    ? `<span class="current">1</span>`
    : pageLink(1);

  // Ellipsis after page 1 if needed
  if (currentPage > 3) {
    navHtml += `<span class="ellipsis">&hellip;</span>`;
  }

  // Pages around the current page
  for (let p = Math.max(2, currentPage - 1); p <= Math.min(totalPages - 1, currentPage + 1); p++) {
    navHtml += p === currentPage
      ? `<span class="current">${p}</span>`
      : pageLink(p);
  }

  // Ellipsis before last page if needed
  if (currentPage < totalPages - 2) {
    navHtml += `<span class="ellipsis">&hellip;</span>`;
  }

  // Always show last page (if more than 1 page total)
  if (totalPages > 1) {
    navHtml += currentPage === totalPages
      ? `<span class="current">${totalPages}</span>`
      : pageLink(totalPages);
  }

  // Next arrow
  if (currentPage < totalPages) {
    navHtml += `<a href="/blog.html?page=${currentPage + 1}" aria-label="Next page">&raquo;</a>`;
  }

  nav.innerHTML = navHtml;

});

</script>

        </div>
      </div>
    </section>
